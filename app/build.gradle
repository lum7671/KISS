buildscript {
    repositories {
        maven {
            url = "https://plugins.gradle.org/m2/"
        }
        mavenCentral()
    }
}

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android' version '2.0.21'  // Java 17 안정 지원 버전
    id 'net.ltgt.errorprone' version '4.1.0'  // 안정 버전 유지
    id 'com.github.ben-manes.versions' version '0.50.0'  // 의존성 업데이트 확인
}

android {
    sourceSets {
        main {
            aidl.srcDirs = ['src/main/aidl']
        }
    }
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        applicationId 'kr.lum7671.kiss'  // 표준 KISS 런처 패키지명으로 통일
        minSdkVersion 33  // Android 13+ (갤럭시 노트20 울트라 호환) - 사용자 설정 유지
        compileSdk = 35
        targetSdkVersion 35
    versionCode 416
    versionName "4.1.6"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // BuildConfig에 업스트림 버전 정보 추가
        buildConfigField "String", "UPSTREAM_VERSION", '"3.22.2"'
        buildConfigField "String", "UPSTREAM_VERSION_CODE", '"215"'
        buildConfigField "String", "OPTIMIZED_BY", '"lum7671"'
        buildConfigField "String", "BUILD_DATE", "\"${new Date().format('yyyy-MM-dd')}\""
        // 프로파일링을 위한 설정 (Android 15+에서 모든 기능 지원)
        manifestPlaceholders = [
            profileable: "true"
        ]
    }

    signingConfigs {
        debug {
            enableV2Signing = true
            enableV3Signing = true
        }
        release {
            def keystorePropertiesFile = rootProject.file("keystore/keystore.properties")
            if (keystorePropertiesFile.exists()) {
                def keystoreProperties = new Properties()
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
                
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                
                enableV2Signing = true
                enableV3Signing = true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = signingConfigs.release  // 릴리즈 키로 서명
            buildConfigField "String", "BUILD_TYPE", '"release"'
        }
        debug {
            buildConfigField "String", "BUILD_TYPE", '"debug"'
        }
        profile {
            debuggable true
            minifyEnabled false
            shrinkResources = false
            proguardFiles getDefaultProguardFile('proguard-android.txt')
            buildConfigField "String", "BUILD_TYPE", '"profile"'
            manifestPlaceholders.putAll([
                profileable: "true",
                enableOnDeviceAbi: "true"
            ])
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        encoding = 'UTF-8'
    }
    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += [
            '-opt-in=kotlinx.coroutines.ExperimentalCoroutinesApi',
            '-Xjsr305=strict',
            '-Xjvm-default=all'
        ]
    }
    lint {
        checkAllWarnings = true
        lintConfig = file('lint.xml')
        baseline = file("lint-baseline.xml")
    }
    namespace = 'fr.neamar.kiss'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.compilerArgs += [
        '-Xlint:deprecation',
        '-Xlint:unchecked'
    ]
}

dependencies {
    // Kotlin & Coroutines 지원 - 최신 버전으로 업데이트
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.0.21"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'  // 업데이트: 1.8.1 → 1.10.2
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2'     // 업데이트: 1.8.1 → 1.10.2
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.5'  // LifecycleScope 지원
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.5' // ViewModelScope 지원
    
    androidTestImplementation 'androidx.test:runner:1.7.0'         // 업데이트: 1.5.2 → 1.7.0
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'  // 업데이트: 3.5.1 → 3.7.0  
    androidTestImplementation 'androidx.test:rules:1.7.0'          // 업데이트: 1.5.0 → 1.7.0

    implementation 'androidx.annotation:annotation:1.9.1'   // 업데이트: 1.8.2 → 1.9.1
    implementation 'androidx.appcompat:appcompat:1.7.1'     // 업데이트: 1.7.0 → 1.7.1  
    implementation 'androidx.fragment:fragment:1.8.9'       // 업데이트: 1.8.4 → 1.8.9
    implementation 'androidx.preference:preference:1.2.1'   // 안정 버전 유지
    implementation 'androidx.recyclerview:recyclerview:1.4.0' // 업데이트: 1.3.2 → 1.4.0

    // 성능 분석 & 디버깅 도구들 (DEBUG 빌드에만 포함)
    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.14'  // 메모리 누수 탐지
    
    // Flipper 대체: Chrome DevTools와 Android Studio Profiler 사용 권장
    // debugImplementation 'com.facebook.flipper:flipper:0.265.0'             // DEPRECATED - 제거됨
    // debugImplementation 'com.facebook.soloader:soloader:0.12.1'            // DEPRECATED - 제거됨  
    // debugImplementation 'com.facebook.flipper:flipper-network-plugin:0.265.0' // DEPRECATED - 제거됨
    
    // 네트워크 디버깅 대체 도구
    debugImplementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'  // HTTP 로깅
    
    // 성능 모니터링 (DEBUG 빌드에만 포함)
    debugImplementation 'androidx.tracing:tracing:1.3.0'                    // 업데이트: 1.2.0 → 1.3.0

    // ANR (Application Not Responding) 탐지 - 실제 사용됨
    debugImplementation 'com.github.anrwatchdog:anrwatchdog:1.4.0'         // ANR 감지

    // 이미지 로딩 및 캐싱 최적화 - Coil로 교체 (Kotlin-first, 경량)
    implementation 'io.coil-kt:coil:2.7.0'                              // Coil 코어
    implementation 'io.coil-kt:coil-base:2.7.0'                         // Coil 베이스  
    // implementation 'com.github.bumptech.glide:glide:4.16.0'          // Glide 제거
    // annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'  // Glide 컴파일러 제거
    implementation 'androidx.collection:collection:1.4.5'               // LruCache 등 컬렉션 유틸리티

    // Shizuku - 루트 권한 대안으로 시스템 API 접근
    implementation 'dev.rikka.shizuku:api:13.1.5'                          // Shizuku API
    implementation 'dev.rikka.shizuku:provider:13.1.5'                     // Shizuku Provider

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.11.4'      // 최신 버전 유지
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.11.4'   // 최신 버전 유지
    testRuntimeOnly('org.junit.jupiter:junit-jupiter-engine:5.11.4')      // 최신 버전 유지
    testImplementation 'org.hamcrest:hamcrest-library:3.0'               // 최신 버전 유지

    errorprone('com.google.errorprone:error_prone_core:2.42.0')          // 안정적인 버전 유지
    // Amplitude SDK (업스트림 추가) - 최신 안정화 버전으로 업데이트
    implementation 'com.amplitude:android-sdk:2.40.3'

    // R8/R8 minify 오류 해결용 javax.annotation-api 추가
    implementation 'javax.annotation:javax.annotation-api:1.3.2'
    implementation 'org.jetbrains:annotations:24.1.0'
}

tasks.withType(JavaCompile).configureEach {
    options.errorprone {
        disableWarningsInGeneratedCode = true
        disable('MissingOverride')
        disable('MissingSummary')
        disable('EmptyBlockTag')
        disable('EmptyCatch')
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

