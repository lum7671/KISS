# Detekt 1.23.7 설정
# 기본 설정 사용 + 커스터마이징

build:
  maxIssues: -1  # 모든 이슈 표시
  excludeCorrectable: false
  weights:

config:
  validation: true
  warningsAsErrors: false
  checkExhaustiveness: false

style:
  UnusedImports:
    active: true
  UnusedPrivateMember:
    active: true

complexity:
  CyclomaticComplexMethod:
    active: true
    threshold: 15
  LongMethod:
    active: true
    threshold: 60
  LongParameterList:
    active: true
    functionThreshold: 6
    constructorThreshold: 7

naming:
  InvalidPackageDeclaration:
    active: false
  FunctionNaming:
    active: false

performance:
  SpreadOperator:
    active: true
  ForEachOnRange:
    active: true